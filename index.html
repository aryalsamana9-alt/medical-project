<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="E-Health Mental Wellness Platform — Your trusted online healthcare companion" />
    <meta name="theme-color" content="#4A90E2" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💚</text></svg>" />
    <title>E-Health | Mental Wellness Platform</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- ===== BACKGROUND MEDICAL EMOJIS (floating) ===== -->
    <div id="bg-emojis" aria-hidden="true"></div>

    <!-- ===== ANIMATED GRADIENT BACKGROUND ===== -->
    <div class="gradient-bg" aria-hidden="true"></div>

    <!-- ===== TOP NAVIGATION BAR ===== -->
    <header class="topbar" id="topbar">
      <div class="topbar-brand">
        <span class="brand-logo" aria-hidden="true">💚</span>
        <span class="brand-name">E-Health</span>
      </div>
      <div class="topbar-user" id="topbar-user">
        <span class="user-avatar" id="user-avatar" aria-hidden="true">?</span>
        <span class="user-name" id="user-name">Guest</span>
        <button class="btn-logout" id="btn-logout" title="Logout">Logout</button>
      </div>
    </header>

    <!-- ===== SIDEBAR NAVIGATION ===== -->
    <nav class="sidebar" id="sidebar" aria-label="Main navigation">
      <a href="#/dashboard" class="sidebar-link" data-route="dashboard" aria-current="page">
        <span class="sidebar-icon" aria-hidden="true">📊</span>
        <span class="sidebar-label">Dashboard</span>
      </a>
      <a href="#/home" class="sidebar-link" data-route="home">
        <span class="sidebar-icon" aria-hidden="true">🏠</span>
        <span class="sidebar-label">Home</span>
      </a>
      <a href="#/doctors" class="sidebar-link" data-route="doctors">
        <span class="sidebar-icon" aria-hidden="true">👨‍⚕️</span>
        <span class="sidebar-label">Doctors</span>
      </a>
      <a href="#/messages" class="sidebar-link" data-route="messages">
        <span class="sidebar-icon" aria-hidden="true">💬</span>
        <span class="sidebar-label">Messages</span>
      </a>
      <a href="#/profile" class="sidebar-link" data-route="profile">
        <span class="sidebar-icon" aria-hidden="true">👤</span>
        <span class="sidebar-label">Profile</span>
      </a>
      <a href="#/contact" class="sidebar-link" data-route="contact">
        <span class="sidebar-icon" aria-hidden="true">📝</span>
        <span class="sidebar-label">Contact</span>
      </a>
    </nav>

    <!-- ===== MAIN CONTENT AREA (SPA view injection) ===== -->
    <main class="main-content" id="app-content" aria-live="polite"></main>

    <!-- ===== BOOKING MODAL OVERLAY (hidden by default) ===== -->
    <div class="modal-overlay" id="booking-modal" role="dialog" aria-modal="true" aria-label="Book Consultation" hidden>
      <div class="modal-panel" id="booking-panel"></div>
    </div>

    <!-- ===== CONFIRMATION OVERLAY (hidden by default) ===== -->
    <div class="confirm-overlay" id="confirm-overlay" hidden>
      <div class="confirm-card">
        <div class="checkmark-circle">
          <svg viewBox="0 0 52 52" class="checkmark-svg">
            <circle class="checkmark-circle-bg" cx="26" cy="26" r="25" fill="none"/>
            <path class="checkmark-check" fill="none" d="M14 27l7 7 16-16"/>
          </svg>
        </div>
        <h2 class="confirm-title">Booking Confirmed!</h2>
        <p class="confirm-msg" id="confirm-msg"></p>
        <button class="btn-primary" id="confirm-close">Done</button>
      </div>
    </div>

    <!-- ===== CONFETTI CONTAINER ===== -->
    <div id="confetti-container" aria-hidden="true"></div>

    <!-- ===== MAIN APPLICATION SCRIPT (ES Module) ===== -->
    <script type="module" src="js/app.js"></script>
  </body>
</html>
